swerve_cmd_node:
  ros__parameters:
    a: 0.203
    b: 0.16556
    wheel_radius: 0.052
    cmd_vel_topic: /cmd_vel
    joint_state_topic: /joint_states
    command_topic: /swerve_cmd_joint_states
    steering_angle_limit: 0.7854
    steer_alignment_min_scale: 0.45
    steer_alignment_deadband_rad: 0.12
    max_wheel_angular_speed: 12.0
    control_rate_hz: 50.0
    cmd_vel_timeout_sec: 0.5
    use_direct_ik: true
    # Full swerve for teleop/manual. Nav2 forward-only limits are in bot_planning/config/nav2.yaml (DWB).
    enforce_front_forward: false
    allow_reverse: true
    # Tank turn only for explicit manual spin (vx≈0, high omega). Off during Nav2 arcs.
    enable_point_turn: false
    point_turn_steer_target: 0.0
    point_turn_vx_threshold: 0.01
    point_turn_vy_threshold: 0.01
    point_turn_omega_threshold: 0.35
    kx: 4.0
    ky: 4.0
    ktheta: 3.0
    kd_gains:
      - 5.0
      - 5.0
      - 5.0
      - 5.0
