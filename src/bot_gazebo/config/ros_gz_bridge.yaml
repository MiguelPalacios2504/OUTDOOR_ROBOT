# Base bridges (clock, imu, odom, lidar). Camera entries are harmless when use_camera:=false.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: CLOCK

- ros_topic_name: /imu/data
  gz_topic_name: /imu/data
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /ground_truth/odom
  gz_topic_name: /ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  lazy: false
  direction: GZ_TO_ROS

- ros_topic_name: /gnss/fix
  gz_topic_name: /gnss/fix
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# gpu_lidar: URDF <topic>/lidar</topic> -> GZ LaserScan on /lidar, PointCloudPacked on /lidar/points
# (same pattern as MOGI-ROS Week-5-6: scan + scan/points)
- ros_topic_name: /lidar
  gz_topic_name: /lidar
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /lidar/points
  gz_topic_name: /lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: lidar_link

- ros_topic_name: /camera/image
  gz_topic_name: /camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /camera/depth_image
  gz_topic_name: /camera/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /camera/camera_info
  gz_topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  lazy: false
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
